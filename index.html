<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniArcade — Learn by Playing</title>
  <meta name="description" content="27 educational brain games for math, language, memory, science & focus. Progress saved. No ads. No logins. Play and learn." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body class="min-h-screen flex flex-col" style="font-family:'Nunito',sans-serif">

  <!-- Header -->
  <header id="app-header" class="px-6 py-5 sticky top-0 z-30" style="background:rgba(253,246,227,0.95);backdrop-filter:blur(8px);border-bottom:2px solid #d9cbb0">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="omni-logo">🎮</div>
        <div>
          <h1 class="omni-brand">OmniArcade</h1>
          <p class="omni-tagline">27 free games · no ads, no logins, progress saved</p>
        </div>
      </div>
      <div class="flex items-center gap-2 flex-wrap justify-center">
        <div class="omni-search-wrap">
          <span class="omni-search-icon" aria-hidden="true">🔍</span>
          <input id="search-input" type="text" placeholder="Search games…" class="omni-search" aria-label="Search games" />
        </div>
        <button id="sound-toggle-btn" class="omni-pill" aria-label="Toggle sound effects">🔊 SOUND</button>
        <div class="omni-stat">
          <span class="omni-stat-label">PLAYED</span>
          <span class="omni-stat-value">0</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-6 py-8 relative" style="z-index:1">

    <!-- Hero -->
    <section class="mb-8 p-6 md:p-10 relative" style="background:#fffbf0;border:2px solid #d9cbb0;border-radius:18px;box-shadow:0 4px 16px rgba(43,33,24,0.08)">
      <h2 class="text-3xl md:text-5xl font-black mb-3" style="color:#2b2118;font-family:'Fredoka',sans-serif;line-height:1.1">
        Brain games that <span style="color:#e76f51">build real skills</span>
      </h2>
      <p class="text-sm md:text-base max-w-2xl leading-relaxed" style="color:#6b5d4f">
        Math, language, memory, science, and a full arcade of classics. Every game saves your progress and works offline — for learners of every age.
      </p>
    </section>

    <!-- Recommended strip (adaptive) -->
    <section id="recommended-strip" class="mb-8"></section>

    <!-- Category Navigation -->
    <section id="category-bar" class="mb-8"></section>

    <!-- Game Cards Grid -->
    <section id="game-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></section>

  </main>

  <!-- Footer -->
  <footer class="py-6 px-6 mt-12 text-center text-xs" style="background:#f5ecd7;border-top:2px solid #d9cbb0;color:#6b5d4f;font-family:'Fredoka',sans-serif">
    <strong style="color:#e76f51">OmniArcade</strong> · Learn by Playing · 2026
  </footer>

  <!-- Game Modal Overlay -->
  <div id="game-modal-overlay" class="fixed inset-0 z-50 flex items-center justify-center p-4 hidden overflow-y-auto" style="background:rgba(43,33,24,0.6);backdrop-filter:blur(6px)">
    <div id="game-modal-container" class="w-full max-w-3xl my-auto"></div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
